spring:
  application:
    # Nome da aplicação
    name: flowchain-api

  datasource:
    # Endereço da base de dados
    # jdbc:postgresql → protocolo de ligação ao PostgreSQL
    # localhost:5432  → endereço e porta do container PostgreSQL
    # flowchain       → nome da base de dados
    url: jdbc:postgresql://localhost:5432/flowchain

    # Utilizador e password definidos no docker-compose.yml
    username: flowchain_user
    password: flowchain_pass

    # Driver que permite ao Java comunicar com o PostgreSQL
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update → o Hibernate cria/atualiza as tabelas automaticamente
      # quando a aplicação arranca
      # Nunca usar 'create' em produção — apaga todos os dados!
      ddl-auto: update

    # Mostra as queries SQL geradas no terminal
    # Muito útil para aprender e fazer debug
    show-sql: true

    properties:
      hibernate:
        # Diz ao Hibernate que estamos a usar PostgreSQL
        dialect: org.hibernate.dialect.PostgreSQLDialect

        # Formata o SQL no terminal para ficar mais legível
        format_sql: true

# Porta onde a API vai correr
# Acedes em http://localhost:8080
server:
  port: 8080


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  packages-to-scan: com.flowchain.api

  # Configuração do JWT
jwt:
    # Chave secreta usada para assinar os tokens.
    # NUNCA deve ser partilhada — quem a tiver consegue forjar tokens válidos.
    # Em produção virá de variável de ambiente, não do ficheiro.
    # Tem de ser longa: o HS256 exige pelo menos 256 bits (32 caracteres).
    secret: flowchain-super-secret-key-change-this-in-production-2026

    # Validade do token em milissegundos.
    # 86400000 ms = 24 horas (24 * 60 * 60 * 1000)
    expiration: 86400000